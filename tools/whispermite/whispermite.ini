# whispermite.ini - settings for whispermite.py
# Edit the [wspr] section with YOUR details before running 'configure'.

[serial]
# auto = first CH340 / ttyUSB device found
port = auto
# Run 'python3 whispermite.py detect' if text looks like garbage
baud = 9600
# crlf | cr | lf
line_end = crlf
# seconds to wait after each menu command
command_gap_s = 1.0

[gpio]
# BCM pin wired (through an optocoupler) across the Sync button.
# Leave empty to press the button by hand when prompted.
sync_pin = 17
press_ms = 150

[wspr]
# Up to 6 characters, no '/'
callsign = N0CALL
# 4-character Maidenhead locator (Barbados is GK03)
locator = GK03
# WSPR power in dBm: 200 mW = 23
power_dbm = 23
# Transmit frequencies in MHz - run 'python3 whispermite.py freqs'
# Pick the two bands YOUR unit was built for (Low 60/40, Mid 30/20, High 15/12/10)
f1_mhz = 7.0401
f2_mhz = 5.3662
# 1, 2 or DUAL (alternates F1 / F2)
band = DUAL
# Minutes between transmissions, even number
interval_min = 10
# Random +/-80 Hz hop each transmission (recommended by Kanga)
random_shift = yes
# Optional fine calibration ('C' command, default 1000). Leave blank to keep.
correction =

[qrss]
enabled = no
callsign = N0CALL
freq_mhz = 7.0399
# OOK | FSK | DTF
mode = FSK
dot_ms = 3000
# 0 = off, 1-7 = fill patterns
pattern = 0
shift_hz = 5

[sync]
# Press Sync on the next N-minute boundary (10 lines up with most grabbers)
boundary_min = 10
# Timing trim in ms if your spots show a consistent DT offset (+ = later)
offset_ms = 0
