# Uranus beacon configuration
# Frequencies for FT8 / WSPR / UR are the SSB (USB) dial frequency; the audio
# sits at audio_offset_hz above it. APRS frequencies are FM channel centres.
#
# CHECK BEFORE ENABLING: Barbados is in IARU Region 2, where 144.390 MHz is the
# APRS channel. 144.800 is the Region 1 (Europe/Africa) APRS channel, and
# 145.570 / 144.930 / 432.800 are not APRS channels I know of here. They are
# listed because you asked for them; make sure they are permitted by your
# licence and band plan and that nobody else uses them.

[station]
callsign = "N0CALL"          # your callsign (UR mode and WSPR: max 6 chars, no /)
grid = "GK03"                # 4-char Maidenhead locator (sent on air)
grid6 = "GK03ec"             # 6-char locator for map distances (optional)
lat = 13.10                  # APRS position (decimal degrees, + = N / E)
lon = -59.60
aprs_ssid = 11               # -11 = balloon/aircraft/beacon convention; 0 = none
aprs_path = "WIDE1-1"        # keep paths short to spare the digipeaters
aprs_symbol_table = "/"
aprs_symbol = "-"
aprs_comment = "Uranus beacon"
wspr_power_dbm = 37          # REAL power you send, in dBm (37 = 5 W)
audio_offset_hz = 1500

[receive]                    # listen mode
mode = "pumpkin"             # "pumpkin" (SSB), "cucumber" (FM) or "ur"
submode = "PUMPKIN-60"
dial_mhz = 144.490
audio_offset_hz = 1500
audio_device = "default"     # rig's USB audio INPUT (see list-audio-devices)
source = "audio"             # "audio" (rig/sound card) or "rtl_fm" (RTL-SDR dongle)
rtl_ppm = 0                  # RTL-SDR frequency correction, parts per million
rtl_gain = 40                # RTL-SDR gain, dB

[reporting]
pskreporter = false          # upload your Pumpkin/UR decodes to PSK Reporter
pskreporter_test_server = true   # true = PSK Reporter's test port; set false when you are happy
pskreporter_contact = ""     # optional e-mail PSK Reporter asks query clients to supply
online_minutes = 30          # map: blue if heard within this many minutes, else red

[timing]
gap_between_tx_s = 60        # 1 minute between transmissions in a band
gap_between_bands_s = 180    # 3 minutes between bands

[carrier_sense]              # listen-before-talk for APRS (needs S-meter via CAT)
enabled = true
listen_s = 2.0
threshold_db = -40           # dB relative to S9 reported by rigctld
retries = 3

[rig_modes]                  # Hamlib mode names
aprs = "FM"
ft8 = "USB"                  # use "PKTUSB" if your rig needs a data mode for USB audio
wspr = "USB"
ur = "USB"

[radio]
profile = "Generic CAT rig with USB audio"   # see the Station setup window for the list
backend = "dry-run"          # "dry-run" (writes WAVs), "hamlib" (CAT rig) or "hackrf" (SDR transmit)
rigctld_host = "127.0.0.1"
rigctld_port = 4532
audio_device = "default"     # ALSA device of the rig's USB sound card, e.g. "plughw:1,0"
max_tx_s = 320

[sdr]                        # HackRF transmit backend (experimental, see docs/SDR.md)
hackrf_txvga = 10            # 0-47 dB; start LOW
hackrf_amp = false           # extra 11 dB amplifier stage
sample_rate = 2400000
offset_hz = 200000           # tune off-centre so the HackRF's DC leak is outside the signal

# ------------------------------------------------------------------ 2 m
[[band]]
name = "2m"
active = true                # switch the whole band on/off (Station setup does this)

  [[band.slot]]
  mode = "aprs"
  freq_mhz = 144.390
  enabled = true

  [[band.slot]]
  mode = "aprs"
  freq_mhz = 145.570
  enabled = false            # not a Region-2 APRS channel - enable only if permitted

  [[band.slot]]
  mode = "aprs"
  freq_mhz = 144.800
  enabled = false            # Region-1 APRS channel - enable only if permitted

  [[band.slot]]
  mode = "aprs"
  freq_mhz = 144.930
  enabled = false            # enable only if permitted

  [[band.slot]]
  mode = "ft8"
  freq_mhz = 144.174

  [[band.slot]]
  mode = "wspr"
  freq_mhz = 144.490         # usual 2 m WSPR dial is 144.489

  [[band.slot]]              # experimental Uranus mode - see docs/UR-MODE.md
  mode = "ur"
  submode = "UR-60"
  freq_mhz = 144.490
  enabled = false

  [[band.slot]]              # coherent Uranus mode - needs GPSDO at BOTH ends
  mode = "pumpkin"
  submode = "PUMPKIN-60"
  freq_mhz = 144.490
  enabled = false

  [[band.slot]]              # Cucumber on FM: agree a simplex channel locally before enabling
  mode = "cucumber"
  submode = "CUCUMBER-60"
  freq_mhz = 145.580
  enabled = false

# ------------------------------------------------------------------ 1.25 m (220 MHz)
# Region 2 only (Barbados: 222-225 MHz - confirm on your licence).
# Weak-signal segment 222.000-222.150; 222.100 is the SSB/CW calling
# frequency, so beacons sit clear of it. Few all-mode rigs cover 1.25 m:
# use a transverter (set transverter_lo_mhz, e.g. 194 for a 28 MHz IF) or
# the HackRF backend. Enable the band and its slots when your station is ready.
[[band]]
name = "1.25m"
active = false               # switch on when your 1.25 m station is ready
transverter_lo_mhz = 0.0      # 0 = rig tunes 222 MHz directly

  [[band.slot]]
  mode = "pumpkin"
  submode = "PUMPKIN-60"
  freq_mhz = 222.130
  enabled = true

  [[band.slot]]
  mode = "ur"
  submode = "UR-60"
  freq_mhz = 222.130
  enabled = false

  [[band.slot]]              # Cucumber: weak-signal beacon for FM-only 220 radios
  mode = "cucumber"
  submode = "CUCUMBER-60"
  freq_mhz = 223.420         # FM simplex segment, clear of the 223.500 calling frequency
  enabled = true

# ------------------------------------------------------------------ 70 cm
[[band]]
name = "70cm"
active = true

  [[band.slot]]
  mode = "aprs"
  freq_mhz = 432.800
  enabled = false            # enable only if permitted

  [[band.slot]]
  mode = "ft8"
  freq_mhz = 432.174

  [[band.slot]]
  mode = "wspr"
  freq_mhz = 432.300

  [[band.slot]]
  mode = "ur"
  submode = "UR-60"
  freq_mhz = 432.300
  enabled = false

  [[band.slot]]
  mode = "pumpkin"
  submode = "PUMPKIN-60"
  freq_mhz = 432.300
  enabled = false

  [[band.slot]]              # Cucumber on FM: agree a simplex channel locally before enabling
  mode = "cucumber"
  submode = "CUCUMBER-60"
  freq_mhz = 433.500
  enabled = false
