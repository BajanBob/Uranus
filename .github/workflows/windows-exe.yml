name: Build release packages

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy scipy sounddevice pyserial pyinstaller pillow

      - name: Run tests
        run: python -m unittest -v tests.test_uranus

      - name: Fetch Hamlib for Windows (bundled, so users install nothing)
        shell: pwsh
        run: |
          $v = "4.7.2"
          Invoke-WebRequest "https://github.com/Hamlib/Hamlib/releases/download/$v/hamlib-w64-$v.zip" -OutFile hamlib.zip
          Expand-Archive hamlib.zip -DestinationPath hamlib_x -Force
          $bin = (Get-ChildItem hamlib_x -Recurse -Filter rigctld.exe | Select-Object -First 1).DirectoryName
          New-Item -ItemType Directory -Force hamlib | Out-Null
          Copy-Item "$bin/*" hamlib/ -Recurse
          $root = Split-Path $bin -Parent
          Get-ChildItem $root -File | Where-Object { $_.Name -match '^(COPYING|LICENSE|README|AUTHORS)' } |
            ForEach-Object { Copy-Item $_.FullName "hamlib/$($_.Name).txt" }
          "Hamlib $v for Windows (64-bit), free software by the Hamlib project, LGPL-2.1 / GPL-2.0.`r`nUranus starts rigctld from this folder automatically.`r`nSource code: https://github.com/Hamlib/Hamlib/releases/tag/$v" | Set-Content hamlib/HAMLIB-SOURCE.txt
          ./hamlib/rigctl.exe --version
          ./hamlib/rigctl.exe -l | Select-String "IC-9100|IC-9700"

      - name: Check every radio profile is in the bundled Hamlib
        run: >
          python -c "from uranus import radios, rigctl;
          bad=[(p.name,p.hamlib_name) for p in radios.PROFILES if p.hamlib_name and not rigctl.model_for(p.hamlib_name)];
          [print(p.name, '->', rigctl.model_for(p.hamlib_name)) for p in radios.PROFILES if p.hamlib_name];
          assert rigctl.model_list().get('IC-9100') == 3068, rigctl.model_list().get('IC-9100');
          assert not bad, bad; print('Hamlib models OK')"

      - name: GUI smoke test (faceplate, wizard, PSK panel, setup, chat)
        run: python tools/ci/gui_smoke.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots/

      - name: Restore config after smoke test
        run: git checkout -- config/uranus.toml

      - name: Build Uranus.exe
        run: >
          pyinstaller --noconfirm --onefile --windowed --name Uranus
          --add-data "config/uranus.toml;config"
          --collect-submodules uranus
          uranus_app.py

      - name: Build WhisperMite-Setup.exe
        run: >
          pyinstaller --noconfirm --onefile --windowed --name WhisperMite-Setup
          tools/whispermite/whispermite_gui.py

      - name: Assemble package
        shell: pwsh
        run: |
          $pkg = "Uranus-Windows-exe"
          New-Item -ItemType Directory -Force "$pkg/config", "$pkg/docs", "$pkg/WhisperMite" | Out-Null
          Copy-Item dist/Uranus.exe $pkg/
          Copy-Item config/uranus.toml "$pkg/config/"
          Copy-Item docs/*.md "$pkg/docs/"
          Copy-Item README.md $pkg/
          Copy-Item LICENSE "$pkg/LICENSE.txt"
          Copy-Item windows/README-WINDOWS.txt $pkg/
          Copy-Item windows/start-rigctld.bat $pkg/
          Copy-Item hamlib "$pkg/hamlib" -Recurse
          Copy-Item dist/WhisperMite-Setup.exe "$pkg/WhisperMite/"
          Copy-Item tools/whispermite/README.md "$pkg/WhisperMite/"
          Compress-Archive -Path $pkg -DestinationPath "$pkg.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: Uranus-Windows-exe
          path: Uranus-Windows-exe.zip

      - name: Build Raspberry Pi and Linux zips
        shell: pwsh
        run: |
          foreach ($t in "RaspberryPi", "Linux") {
            $d = "Uranus-$t"
            New-Item -ItemType Directory -Force $d | Out-Null
            git archive HEAD | tar -x -C $d
            Remove-Item -Recurse -Force "$d/windows", "$d/.github" -ErrorAction SilentlyContinue
            $first = if ($t -eq "RaspberryPi") { "linux/install-pi.sh" } else { "linux/install-linux.sh" }
            "Uranus for $t`r`n`r`nUnzip, then run:  bash $first`r`nSee README.md for everything else." | Set-Content "$d/START-HERE.txt"
            Compress-Archive -Path $d -DestinationPath "$d.zip" -Force
          }

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $v = python -c "import uranus; print(uranus.__version__)"
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Publish GitHub Release (main branch)
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Uranus v${{ steps.ver.outputs.version }}
          body: |
            Windows: Uranus-Windows-exe.zip - unzip and double-click Uranus.exe (no Python needed).
            Raspberry Pi: Uranus-RaspberryPi.zip - unzip and run  bash linux/install-pi.sh
            Linux: Uranus-Linux.zip - unzip and run  bash linux/install-linux.sh
            New in this version: plug and play radio control. Hamlib is built in (hamlib folder) and starts by itself; no install, no model number. Press Test radio.
            Free software under GPL-3.0. Testers wanted worldwide: report results under Issues.
          files: |
            Uranus-Windows-exe.zip
            Uranus-RaspberryPi.zip
            Uranus-Linux.zip
          make_latest: true
