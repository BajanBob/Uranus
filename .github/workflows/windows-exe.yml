name: Build release packages

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy scipy sounddevice pyserial pyinstaller pillow

      - name: Run tests
        run: python -m unittest -v tests.test_uranus

      - name: Fetch Hamlib for Windows (bundled, so users install nothing)
        shell: pwsh
        run: |
          $v = "4.7.2"
          Invoke-WebRequest "https://github.com/Hamlib/Hamlib/releases/download/$v/hamlib-w64-$v.zip" -OutFile hamlib.zip
          Expand-Archive hamlib.zip -DestinationPath hamlib_x -Force
          $bin = (Get-ChildItem hamlib_x -Recurse -Filter rigctld.exe | Select-Object -First 1).DirectoryName
          New-Item -ItemType Directory -Force hamlib | Out-Null
          Copy-Item "$bin/*" hamlib/ -Recurse
          $root = Split-Path $bin -Parent
          Get-ChildItem $root -File | Where-Object { $_.Name -match '^(COPYING|LICENSE|README|AUTHORS)' } |
            ForEach-Object { Copy-Item $_.FullName "hamlib/$($_.Name).txt" }
          "Hamlib $v for Windows (64-bit), free software by the Hamlib project, LGPL-2.1 / GPL-2.0.`r`nUranus starts rigctld from this folder automatically.`r`nSource code: https://github.com/Hamlib/Hamlib/releases/tag/$v" | Set-Content hamlib/HAMLIB-SOURCE.txt
          ./hamlib/rigctl.exe --version
          ./hamlib/rigctl.exe -l | Select-String "IC-9100|IC-9700"

      - name: Check every radio profile is in the bundled Hamlib
        run: >
          python -c "from uranus import radios, rigctl;
          bad=[(p.name,p.hamlib_name) for p in radios.PROFILES if p.hamlib_name and not rigctl.model_for(p.hamlib_name)];
          [print(p.name, '->', rigctl.model_for(p.hamlib_name)) for p in radios.PROFILES if p.hamlib_name];
          assert rigctl.model_list().get('IC-9100') == 3068, rigctl.model_list().get('IC-9100');
          assert not bad, bad; print('Hamlib models OK')"

      - name: IC-9100 data modes in the bundled Hamlib (USB-D / FM-D)
        shell: pwsh
        run: |
          $caps = ./hamlib/rigctl.exe -m 3068 --dump-caps
          $caps | Select-String "Mode list|Has set Mode|Can set Mode"
          if (-not ($caps | Select-String "PKTUSB")) { Write-Host "::warning::IC-9100 in this Hamlib has no PKTUSB" }
          $caps | Select-String "Get level"
          if (-not ($caps | Select-String "Get level.*SWR")) { Write-Host "::warning::IC-9100 in this Hamlib cannot read SWR" } else { Write-Host "IC-9100 SWR reading: supported" }

      - name: GUI smoke test (faceplate, wizard, PSK panel, setup, chat)
        timeout-minutes: 6
        run: python -u tools/ci/gui_smoke.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots/

      - name: Restore config after smoke test
        run: git checkout -- config/uranus.toml

      - name: Build Uranus.exe
        run: >
          pyinstaller --noconfirm --onefile --windowed --name Uranus
          --add-data "config/uranus.toml;config"
          --collect-submodules uranus
          uranus_app.py

      - name: Build WhisperMite-Setup.exe
        run: >
          pyinstaller --noconfirm --onefile --windowed --name WhisperMite-Setup
          tools/whispermite/whispermite_gui.py

      - name: Assemble package
        shell: pwsh
        run: |
          $pkg = "Uranus-Windows-exe"
          New-Item -ItemType Directory -Force "$pkg/config", "$pkg/docs", "$pkg/WhisperMite" | Out-Null
          Copy-Item dist/Uranus.exe $pkg/
          Copy-Item config/uranus.toml "$pkg/config/"
          Copy-Item docs/*.md "$pkg/docs/"
          Copy-Item README.md $pkg/
          Copy-Item LICENSE "$pkg/LICENSE.txt"
          Copy-Item windows/README-WINDOWS.txt $pkg/
          Copy-Item windows/start-rigctld.bat $pkg/
          Copy-Item hamlib "$pkg/hamlib" -Recurse
          Copy-Item dist/WhisperMite-Setup.exe "$pkg/WhisperMite/"
          Copy-Item tools/whispermite/README.md "$pkg/WhisperMite/"
          Compress-Archive -Path $pkg -DestinationPath "$pkg.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: Uranus-Windows-exe
          path: Uranus-Windows-exe.zip

      - name: Build Raspberry Pi and Linux zips
        shell: pwsh
        run: |
          foreach ($t in "RaspberryPi", "Linux") {
            $d = "Uranus-$t"
            New-Item -ItemType Directory -Force $d | Out-Null
            git archive HEAD | tar -x -C $d
            Remove-Item -Recurse -Force "$d/windows", "$d/.github" -ErrorAction SilentlyContinue
            $first = if ($t -eq "RaspberryPi") { "linux/install-pi.sh" } else { "linux/install-linux.sh" }
            "Uranus for $t`r`n`r`nUnzip, then run:  bash $first`r`nSee README.md for everything else." | Set-Content "$d/START-HERE.txt"
            Compress-Archive -Path $d -DestinationPath "$d.zip" -Force
          }

      - name: Zip screenshots
        shell: pwsh
        run: Compress-Archive -Path screenshots/* -DestinationPath Uranus-screenshots.zip -Force

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $v = python -c "import uranus; print(uranus.__version__)"
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Publish GitHub Release (main branch)
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Uranus v${{ steps.ver.outputs.version }}
          body: |
            Windows: Uranus-Windows-exe.zip - unzip and double-click Uranus.exe (no Python needed).
            Raspberry Pi: Uranus-RaspberryPi.zip - unzip and run  bash linux/install-pi.sh
            Linux: Uranus-Linux.zip - unzip and run  bash linux/install-linux.sh
            New in this version: Mission profiles - one click sets Uranus up for Hurricane watch, Field day, Maritime, DX hunt, Overnight beacon or 2 m propagation watch (decoder, timetable and tools; never your transmit bands). Best band now (from what you hear, who hears you and the sun). Signal ID now learns: tell it Right or Wrong and it remembers what normally lives on each frequency, flagging anything NEW. Weather fax autopilot (day/night frequency, hops when nothing starts) and a chart gallery. Interference doctor (step-by-step noise hunt). Plain-English command bar ("listen on 2 m tonight and wake me for an opening"). Smart beacon (sends less often on a dead band). Uranus network (ping paths overheard between other stations drawn on the map). Spoken announcements, large text, colour-blind-safe colours and a Tradewind or high-contrast faceplate. Station health check. Also from 0.25: Signal ID - "what is this I'm hearing?" Press Signal ID, then Identify: Uranus listens for 15 seconds and names every signal and kind of interference in the passband (FT8 and other WSJT-X modes, CW, RTTY, SITOR-B/NAVTEX, weather fax, ALE, voice, carriers, mains hum, charger noise, clicks), says what each is, what it sounds like and what to do next, and lists known users of the dial frequency. The waterfall now keeps its picture when you press Bigger. Also from 0.24: Pumpkin ping - in Chat, type another station's callsign and press Ping. Its Uranus answers by itself with a Pumpkin Report (how strongly it hears you), yours answers with how strongly you hear it, and both sides get the report: SNR each way, date and time, distance. Previous two-way contacts show on the station map as a smashed pumpkin. Try Ping demo without a radio. Also from 0.23: AUTO decodes FT8 on every slot first, so a busy FT8 band is no longer mislabelled JT65, RTTY or UR, and AUTO no longer wanders off to follow false UR or JT65 signals. Bigger receiver spectrum (fills the window, with a Bigger button) and legible labels above it that stay for 5 minutes - green for decoded callsigns, amber for identified signals - plus a 5-minute passband list beside it. New receive modes: JT65, JT9, FST4 and FST4W (WSJT-X). New Weather fax window: HF WEFAX from New Orleans (NMG), Boston (NMF) and 30 other stations, tuned by CAT, charts saved as pictures. New Scanner: steps through every known and your own frequency on the bands and modes you tick, stops on a signal for up to 3 minutes or until it goes quiet, with Continue and Ignore. Add your own frequencies with the + button beside MHz. Screenshot + share: save a picture of the screen and share Uranus by WhatsApp or email.
            Free software under GPL-3.0. Testers wanted worldwide: report results under Issues.
          files: |
            Uranus-Windows-exe.zip
            Uranus-RaspberryPi.zip
            Uranus-Linux.zip
            Uranus-screenshots.zip
          make_latest: true
