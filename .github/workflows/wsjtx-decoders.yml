name: WSJT-X decoder round trip (Linux)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  roundtrip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install WSJT-X and Python packages
        run: |
          sudo apt-get update
          sudo apt-get install -y wsjtx
          python -m pip install numpy scipy
          which jt9 wsprd ft8code ft4code wsprcode
          jt9 --help 2>&1 | sed -n '40,120p' || true
          ft4code "CQ 8P5AB GK03" || true
          ft8code "CQ 8P5AB GK03" | tail -8 || true
      - name: Encode with WSJT-X, decode with Uranus
        run: python tools/ci/wsjtx_roundtrip.py || true
